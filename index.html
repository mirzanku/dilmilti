    <script>
      (function () {
        try {
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                if (
                  key.indexOf('workbox-') === 0 ||
                  key.indexOf('ptsp-dilmilti5-') === 0 ||
                  (key.indexOf('dilmilti5-') === 0 && key.indexOf('-v7') === -1)
                ) {
                  caches.delete(key);
                }
              });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                var scriptUrl = (reg.active && reg.active.scriptURL) || (reg.installing && reg.installing.scriptURL) || (reg.waiting && reg.waiting.scriptURL) || '';
                if (
                  scriptUrl.indexOf('dev-sw.js') !== -1 ||
                  scriptUrl.indexOf('sw-ptsp.js') !== -1 ||
                  scriptUrl.indexOf('workbox') !== -1
                ) {
                  reg.unregister();
                } else {
                  reg.update();
                }
              });
            });
          }
        } catch (e) {}
      })();
    </script>
