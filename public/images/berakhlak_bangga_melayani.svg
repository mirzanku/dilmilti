<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%" fill="none">
  <!-- Background Card -->
  <rect width="450" height="110" rx="16" fill="#ffffff" fill-opacity="0.96" stroke="#fbbf24" stroke-width="2.5"/>
  
  <!-- BerAKHLAK Main Text -->
  <g transform="translate(20, 20)">
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#C81E1E">Ber</text>
    <text x="62" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#8B1010">AKHLAK</text>
    
    <!-- Accent Chevron -->
    <path d="M 226 14 L 236 24 L 226 34 L 230 38 L 244 24 L 230 10 Z" fill="#C81E1E"/>

    <!-- Subtitle Line 1 -->
    <text x="2" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#1e293b">
      <tspan fill="#C81E1E" font-weight="900">B</tspan>erorientasi Pelayanan  <tspan fill="#C81E1E" font-weight="900">A</tspan>kuntabel  <tspan fill="#C81E1E" font-weight="900">K</tspan>ompeten
    </text>

    <!-- Subtitle Line 2 -->
    <text x="2" y="69" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#1e293b">
      <tspan fill="#C81E1E" font-weight="900">H</tspan>armonis  <tspan fill="#C81E1E" font-weight="900">L</tspan>oyal  <tspan fill="#C81E1E" font-weight="900">A</tspan>daptif  <tspan fill="#C81E1E" font-weight="900">K</tspan>olaboratif
    </text>
  </g>

  <!-- Vertical Divider -->
  <line x1="272" y1="20" x2="272" y2="90" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- #bangga melayani bangsa Section -->
  <g transform="translate(288, 20)">
    <!-- Hashtag symbol -->
    <g transform="translate(0, 8)">
      <!-- Slanted Vertical Bars -->
      <rect x="12" y="2" width="6.5" height="52" rx="2" fill="#C81E1E" transform="skewX(-14)"/>
      <rect x="25" y="2" width="6.5" height="52" rx="2" fill="#C81E1E" transform="skewX(-14)"/>
      <!-- Horizontal Bars -->
      <rect x="2" y="16" width="40" height="6.5" rx="2" fill="#C81E1E"/>
      <rect x="0" y="32" width="40" height="6.5" rx="2" fill="#C81E1E"/>
    </g>

    <!-- Text: bangga melayani bangsa -->
    <g transform="translate(48, 14)">
      <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#0f172a" letter-spacing="-0.5">bangga</text>
      <text x="0" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#0f172a" letter-spacing="-0.5">melayani</text>
      <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#0f172a" letter-spacing="-0.5">bangsa</text>
    </g>
  </g>
</svg>
